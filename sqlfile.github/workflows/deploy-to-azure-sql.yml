name: Deploy SQL to Azure

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install sqlcmd tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mssql-tools unixodbc-dev
          echo 'export PATH="$PATH:/opt/mssql-tools/bin"' >> ~/.bashrc

      - name: Run SQL script on Azure SQL
        run: |
          sqlcmd -S ${{ secrets.AZURE_SQL_SERVER }} \
                 -d ${{ secrets.AZURE_SQL_DATABASE }} \
                 -U ${{ secrets.AZURE_SQL_USER }} \
                 -P ${{ secrets.AZURE_SQL_PASSWORD }} \
                 -i scripts/01-create-tables.sql

      - name: Load sample customers data
        run: |
          bcp Customers in "sample-data/customers.csv" -c -t, \
              -S ${{ secrets.AZURE_SQL_SERVER }} \
              -d ${{ secrets.AZURE_SQL_DATABASE }} \
              -U ${{ secrets.AZURE_SQL_USER }} \
              -P ${{ secrets.AZURE_SQL_PASSWORD }}

      - name: Load sample orders data
        run: |
          bcp Orders in "sample-data/orders.csv" -c -t, \
              -S ${{ secrets.AZURE_SQL_SERVER }} \
              -d ${{ secrets.AZURE_SQL_DATABASE }} \
              -U ${{ secrets.AZURE_SQL_USER }} \
              -P ${{ secrets.AZURE_SQL_PASSWORD }}
