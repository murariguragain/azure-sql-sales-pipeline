name: Deploy SQL to Azure

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install sqlcmd (NEW method)
      run: |
        wget https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
        sudo dpkg -i packages-microsoft-prod.deb
        sudo apt-get update
        sudo apt-get install -y mssql-tools unixodbc-dev
      env:
        ACCEPT_EULA: Y

    - name: Add sqlcmd to PATH
      run: echo "/opt/mssql-tools/bin" >> $GITHUB_PATH

    - name: Run SQL script on Azure SQL
      run: |
        sqlcmd -S ${{ secrets.AZURE_SQL_SERVER }} \
               -d ${{ secrets.AZURE_SQL_DB }} \
               -U ${{ secrets.AZURE_SQL_USERNAME }} \
               -P ${{ secrets.AZURE_SQL_PASSWORD }} \
               -i ./sql/init.sql

    - name: Load sample customers data
      run: |
        sqlcmd -S ${{ secrets.AZURE_SQL_SERVER }} \
               -d ${{ secrets.AZURE_SQL_DB }} \
               -U ${{ secrets.AZURE_SQL_USERNAME }} \
               -P ${{ secrets.AZURE_SQL_PASSWORD }} \
               -i ./sql/sample-customers.sql

    - name: Load sample orders data
      run: |
        sqlcmd -S ${{ secrets.AZURE_SQL_SERVER }} \
               -d ${{ secrets.AZURE_SQL_DB }} \
               -U ${{ secrets.AZURE_SQL_USERNAME }} \
               -P ${{ secrets.AZURE_SQL_PASSWORD }} \
               -i ./sql/sample-orders.sql
